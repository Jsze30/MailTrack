<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>MailTrack</h1>
      <span id="version"></span>
    </header>

    <label class="field">
      Backend URL
      <input id="baseUrl" type="url" placeholder="https://your-app.vercel.app" />
    </label>

    <label class="field">
      Shared secret
      <input id="secret" type="password" placeholder="TRACK_SECRET value" />
    </label>

    <label class="tracking-setting">
      <input id="trackDefault" type="checkbox" />
      Embed a tracking pixel in new emails
    </label>

    <button id="save" class="primary">Save settings</button>
    <p id="settings-status" class="status"></p>

    <section>
      <div class="section-heading">
        <h2>Send later</h2>
        <button id="google-action" class="secondary" type="button">Connect Gmail</button>
      </div>
      <p id="google-status" class="status">Checking Gmail connection…</p>
      <div id="scheduled-list" class="scheduled-list"></div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
